# ---------------------------------------------------------------------------
# Which TechExcel does this gateway talk to?
# ---------------------------------------------------------------------------
#
#   techexcel.live=false  -> serve the built-in mock. Nothing leaves this machine.
#   techexcel.live=true   -> proxy every /api/** call to the real back office at
#                            techexcel.base-url, verbatim, and hand back its real
#                            token and its real rows.
#
# SWITCHING TO THE REAL API IS THESE TWO LINES AND NOTHING ELSE. No code change,
# no rebuild, no redeploy of anything but this file. Callers do not change:
# same paths, same request bodies, same bearer flow, same response envelope.
#
# Live is OFF here on purpose. Turning it on in a committed file is how a test
# run reaches production, so flip it per environment instead. Spring's normal
# precedence applies -- this file, then environment, then system property:
#
#   TECHEXCEL_LIVE=true ./gradlew bootRun
#   java -Dtechexcel.live=true -jar build/libs/fms-backoffice-0.1.0.jar
techexcel.live=false

# Base URL of the real back office, INCLUDING its /TechBoRest prefix. Only read
# when live is on, and startup FAILS if live is on and this is empty -- a gateway
# that boots and then answers nothing is harder to diagnose than one that refuses
# to boot and says why.
#
# Fill this in when TechExcel access arrives. The value below is a placeholder.
techexcel.base-url=

# Upstream read timeout. The vendor's own Ledger capture took 3.1 seconds, so
# this is deliberately not a couple of seconds.
techexcel.timeout=30s

# ---------------------------------------------------------------------------
# Token handling: who logs in, and who keeps the token alive
# ---------------------------------------------------------------------------
#
#   passthrough -> this gateway holds NO credential. Valid for MOCK MODE ONLY:
#                  there is no login route for a caller to obtain a token from,
#                  so a live gateway in this mode would send every request
#                  unauthenticated. Startup REFUSES that combination.
#
#   managed     -> REQUIRED WHEN techexcel.live=true. This gateway logs in as a
#                  service account, holds the token in memory, and refreshes it
#                  on the cron below BEFORE it expires. Every upstream call
#                  carries that token.
#
# THIS SERVICE IS THE ONLY THING THAT LOGS IN TO TECHEXCEL. Callers of this API
# neither present a credential nor receive a token; the back-office session
# belongs to the service, not to whoever called it. That is deliberate -- it
# means a TechExcel credential never has to be distributed to a caller.
#
# The cost is real and must be covered elsewhere: this process holds a live
# TechExcel credential and applies it to any request that reaches it, so ACCESS
# TO THIS SERVICE MUST BE RESTRICTED AT THE NETWORK OR INGRESS LAYER. There is
# no caller authentication in the application itself.
techexcel.auth.mode=passthrough

# How often to CHECK whether the token needs replacing. SIX-FIELD Spring cron:
# second minute hour day-of-month month day-of-week. A five-field Unix expression
# is a start-up failure here, which is the right time to find out. Hourly is
# plenty -- the cron decides how often to LOOK, the age below decides whether to
# ACT, so a missed tick costs nothing.
techexcel.auth.refresh-cron=0 0 * * * *

# Replace a token once it is older than this. The vendor documents 24h validity
# from the moment of generation, so 20h leaves four hours of headroom: a refresh
# can fail and be retried on the next few ticks and still never hand anyone an
# expired token. Startup REFUSES any value >= 24h, because such a refresh always
# runs too late to be worth having.
techexcel.auth.refresh-after=20h

# THE SERVICE CREDENTIAL DOES NOT GO IN THIS FILE. This file is committed.
# Supply it in the environment, where a secret store can inject it:
#
#   export TECHEXCEL_AUTH_USERNAME=...
#   export TECHEXCEL_AUTH_PASSWORD=...
#   TECHEXCEL_LIVE=true TECHEXCEL_AUTH_MODE=managed ./gradlew bootRun
#
# Starting in managed mode without them fails immediately and says so.

# ---------------------------------------------------------------------------
# Rate limit -- see application.yml for the per-endpoint defaults and why they
# are all guesses. Override any of them here, per environment:
# ---------------------------------------------------------------------------
# backoffice.ratelimit.enabled=true
# backoffice.ratelimit.defaults.requests=60
# backoffice.ratelimit.defaults.window=1m
# backoffice.ratelimit.per-endpoint.ledger.requests=10
# backoffice.ratelimit.per-endpoint.ledger.window=1m
